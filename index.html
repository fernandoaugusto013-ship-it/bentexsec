  }


  /* ---------- Editor de conteúdo (administrador) ---------- */
  const ATABS = [['acessos', 'Empresas e acessos'], ['aulas', 'Aulas'], ['perguntas', 'Perguntas da prova'], ['phishing', 'E-mails de phishing'], ['publicar', 'Publicação']];
  const adminTabs = (at) => `<nav class="tabs" id="atabs" aria-label="Seções da administração">${ATABS.map(([k, t]) => `<button type="button" class="tab" data-atab="${k}" ${at === k ? 'aria-current="page"' : ''}>${t}${k === 'publicar' && isDirty() ? '<span class="tab-dot" aria-hidden="true"></span><span class="visually-hidden"> (há alterações não publicadas)</span>' : ''}</button>`).join('')}</nav>`;
  function draftBar(at) {
    const C = state.content, p = C.pub;
    if (!isDirty()) return `<div class="draft-bar ok" id="draft-bar"><span class="state ok">Tudo publicado</span><span class="sub">Versão ${p.v}, publicada em ${fmt(p.at)} por ${esc(p.by)}.</span></div>`;
    const d = diffContent(p.data, C.draft);
    return `<div class="draft-bar warn" id="draft-bar"><span class="state warn">Rascunho não publicado</span><span class="sub">${esc(d.parts.join(' · ') || 'Mudança na ordem dos itens')}. Os colaboradores ainda veem a versão ${p.v}.</span><div class="row draft-actions">${at !== 'publicar' ? '<button type="button" class="btn btn-primary btn-sm" data-atab="publicar">Revisar e publicar</button>' : ''}<button type="button" class="btn-quiet" id="discard-draft">Descartar rascunho</button></div></div>`;
  }
  function findIn(d, id) {
    if (!id) return null;
    for (const m of d.course) { if (m.id === id) return { kind: 'mod', m, obj: m }; const x = m.steps.find((y) => y.id === id); if (x) return { kind: 'step', m, obj: x }; }
    const q = d.quiz.find((y) => y.id === id); if (q) return { kind: 'q', obj: q };
    const e = d.phish.find((y) => y.id === id); if (e) return { kind: 'e', obj: e };
    return null;
  }
  function curSel(at, d = DRAFT()) {
    const id = state.ui.sel, hit = findIn(d, id);
    if (at === 'aulas') return hit && (hit.kind === 'mod' || hit.kind === 'step') ? id : d.course[0]?.steps[0]?.id || d.course[0]?.id || null;
    if (at === 'perguntas') { const f = state.ui.qmod || 'all', list = d.quiz.filter((q) => f === 'all' || q.mod === f); return hit && hit.kind === 'q' ? id : list[0]?.id || null; }
    if (at === 'phishing') return hit && hit.kind === 'e' ? id : d.phish[0]?.id || null;
    return null;
  }
  const moveBtns = (kind, id, i, n, name) => `<span class="ed-tools"><button type="button" class="icon-btn" data-mv="${kind}:${id}:-1" aria-label="Mover ${name} para cima" ${i === 0 ? 'disabled' : ''}>↑</button><button type="button" class="icon-btn" data-mv="${kind}:${id}:1" aria-label="Mover ${name} para baixo" ${i === n - 1 ? 'disabled' : ''}>↓</button></span>`;
  const untitled = (v, ph) => esc(v.trim()) || `<span class="sub">${ph}</span>`;

  function edList(at, d = DRAFT()) {
    const sel = curSel(at, d), cur = (id) => (sel === id ? 'aria-current="true"' : '');
    if (at === 'aulas') return d.course.map((m, mi) => `
      <div class="ed-mod ${m.sector ? 'is-track' : ''}">
        <div class="ed-row"><button type="button" class="ed-item is-mod" data-sel="${m.id}" ${cur(m.id)}><span class="mono">${m.sector ? 'S' : pad2(d.course.filter((x, k) => !x.sector && k <= mi).length)}</span><span>${m.sector ? `<span class="mono ed-sec">SETOR ${esc(m.sector).toUpperCase()}</span>` : ''}${untitled(m.t, 'Módulo sem título')}</span></button>${moveBtns('mod', m.id, mi, d.course.length, 'o módulo ' + (mi + 1))}</div>
        <ol class="ed-sub">${m.steps.map((x, si) => `<li class="ed-row"><button type="button" class="ed-item" data-sel="${x.id}" ${cur(x.id)}><span class="ed-ico" aria-hidden="true">${TYPE_ICON[x.type]}</span><span><span class="visually-hidden">${TYPE_NAME[x.type]}: </span>${untitled(x.t, 'Passo sem título')}</span></button>${moveBtns('step', x.id, si, m.steps.length, 'o passo ' + (si + 1))}</li>`).join('')}</ol>
        <div class="ed-add"><span class="sub">Adicionar:</span><button type="button" class="btn-quiet" data-addstep="${m.id}" data-type="video">Vídeo</button><button type="button" class="btn-quiet" data-addstep="${m.id}" data-type="image">Imagem</button><button type="button" class="btn-quiet" data-addstep="${m.id}" data-type="text">Leitura</button></div>
      </div>`).join('') + '<div class="ed-listfoot"><button type="button" class="btn btn-secondary btn-sm" id="add-mod">Adicionar módulo</button></div>';
    if (at === 'perguntas') {
      const f = state.ui.qmod || 'all', items = d.quiz.map((q, i) => ({ q, i })).filter(({ q }) => f === 'all' || q.mod === f);
      return `<div class="ed-filter"><label for="qmod-f" class="visually-hidden">Filtrar perguntas por módulo</label><select class="input" id="qmod-f" data-qmodf><option value="all">Todos os módulos (${d.quiz.length})</option>${d.course.map((m, k) => `<option value="${m.id}" ${f === m.id ? 'selected' : ''}>${pad2(k + 1)} · ${esc(m.t)} (${d.quiz.filter((q) => q.mod === m.id).length})</option>`).join('')}</select></div>
      <ol class="ed-sub flat">${items.map(({ q, i }) => `<li class="ed-row"><button type="button" class="ed-item" data-sel="${q.id}" ${cur(q.id)}><span class="mono">${pad2(i + 1)}</span><span class="ed-clamp">${untitled(q.q, 'Pergunta sem enunciado')}</span></button></li>`).join('') || '<li class="sub ed-empty">Nenhuma pergunta neste módulo.</li>'}</ol>
      <div class="ed-listfoot"><button type="button" class="btn btn-secondary btn-sm" id="add-q">Adicionar pergunta</button></div>`;
    }
    return `<ol class="ed-sub flat">${d.phish.map((e, i) => `<li class="ed-row"><button type="button" class="ed-item" data-sel="${e.id}" ${cur(e.id)}><span class="state ${e.phish ? 'crit' : 'ok'}">${e.phish ? 'Golpe' : 'Legítimo'}</span><span><b>${untitled(e.from, 'Sem remetente')}</b><span class="sub ed-clamp">${untitled(e.subj, 'Sem assunto')}</span></span></button>${moveBtns('e', e.id, i, d.phish.length, 'o e-mail ' + (i + 1))}</li>`).join('')}</ol>
      <div class="ed-listfoot"><button type="button" class="btn btn-secondary btn-sm" id="add-e">Adicionar e-mail</button></div>`;
  }

  const formWrap = (title, inner, foot) => `<form class="panel pad ed-form" id="ed-form" novalidate><h2 class="h-panel" id="ed-form-title">${title}</h2>${inner}<div class="ed-foot"><span class="hint">Cada mudança vai para o rascunho na hora.</span>${foot}</div></form>`;
  const tf = (id, label, f, v, extra = '') => `<div class="field"><label for="${id}">${label}</label><input class="input" id="${id}" data-f="${f}" value="${esc(v || '')}" autocomplete="off" ${extra}></div>`;
  const ta = (id, label, attr, v, rows, hint = '') => `<div class="field"><label for="${id}">${label}</label><textarea class="input" id="${id}" ${attr} rows="${rows}">${esc(v || '')}</textarea>${hint ? `<span class="hint">${hint}</span>` : ''}</div>`;
  const modOptions = (d, sel) => d.course.map((m, k) => `<option value="${m.id}" ${sel === m.id ? 'selected' : ''}>${pad2(k + 1)} · ${esc(m.t)}</option>`).join('');

  function edForm(at, d = DRAFT()) {
    const hit = findIn(d, curSel(at, d));
    if (!hit) return `<div class="panel pad ed-form"><h2 class="h-panel">Nada selecionado</h2><p class="sub">${at === 'aulas' ? 'Adicione um módulo para começar.' : at === 'perguntas' ? 'Adicione uma pergunta para começar.' : 'Adicione um e-mail para começar.'}</p></div>`;
    const o = hit.obj;
    if (hit.kind === 'mod') {
      const nq = d.quiz.filter((q) => q.mod === o.id).length;
      const secs = [...new Set([...state.users.filter((x) => x.role === 'colab').map((x) => x.sector), ...d.course.map((m) => m.sector).filter(Boolean)])].sort((a, b) => a.localeCompare(b, 'pt'));
      return formWrap(o.sector ? `Trilha do setor · ${esc(o.sector)}` : 'Módulo do curso', `${tf('ef-t', 'Título do módulo', 't', o.t)}
        <div class="field"><label for="ef-sector">Quem faz este módulo</label><select class="input" id="ef-sector" data-f="sector"><option value="" ${o.sector ? '' : 'selected'}>Todos: curso base, conta para o certificado</option>${secs.map((x) => `<option value="${esc(x)}" ${o.sector === x ? 'selected' : ''}>Trilha extra do setor ${esc(x)}</option>`).join('')}</select><span class="hint">Trilhas de setor liberam depois do curso base, valem pontos e medalha e não contam para o certificado.</span></div>
        <p class="sub">${o.steps.length} passo${o.steps.length === 1 ? '' : 's'} · ${nq} pergunta${nq === 1 ? '' : 's'} da prova ligada${nq === 1 ? '' : 's'} a este tema.</p>`, `<button type="button" class="btn-quiet danger" data-del="${o.id}">Excluir módulo e os seus passos</button>`);
    }
    if (hit.kind === 'step') {
      const top = `<div class="ed-row2">${tf('ef-t', 'Título do passo', 't', o.t)}<div class="field"><label for="ef-mod">Módulo</label><select class="input" id="ef-mod" data-move-mod>${modOptions(d, hit.m.id)}</select></div></div>`;
      let body = '';
      if (o.type === 'video') body = `<div class="ed-row2"><div class="field"><label for="ef-sec">Duração em segundos</label><input class="input" type="number" inputmode="numeric" id="ef-sec" data-f="sec" data-num min="4" max="120" value="${o.sec}"><span class="hint">No protótipo o vídeo é simulado. De 4 a 120 segundos.</span></div>${tf('ef-url', 'Link do vídeo final (opcional)', 'url', o.url, 'type="url" spellcheck="false" placeholder="https://"').replace('</div>', '<span class="hint">Para quando você gravar o vídeo. No produto real, o player toca este link.</span></div>')}</div>
        ${ta('ef-caps', 'Legendas, uma por linha, na ordem em que aparecem', 'data-lines="caps"', o.caps.join('\n'), 5)}`;
      if (o.type === 'image') body = `<fieldset class="ed-fs"><legend>Imagem</legend>
          ${safeImg(o.img) ? `<div class="ed-imgrow"><img src="${safeImg(o.img)}" alt="" class="ed-thumb"><div class="stack" style="gap:6px"><span class="sub">Imagem enviada em uso.</span><button type="button" class="btn-quiet" id="ef-clear-img">Usar uma ilustração da biblioteca</button></div></div>
          ${tf('ef-alt', 'Descrição da imagem (lida por leitores de tela)', 'alt', o.alt)}` : `<div class="field"><label for="ef-art">Ilustração da biblioteca</label><select class="input" id="ef-art" data-f="art">${Object.keys(ART).map((k) => `<option value="${k}" ${o.art === k ? 'selected' : ''}>${ART_NAME[k] || k}</option>`).join('')}</select></div>`}
          <div class="field"><label for="ef-file">${safeImg(o.img) ? 'Trocar a imagem' : 'Ou envie a sua imagem'}</label><input class="input" type="file" id="ef-file" accept="image/png,image/jpeg,image/webp"><span class="hint">PNG, JPG ou WebP. No protótipo a imagem é reduzida para caber no navegador.</span></div>
          <div class="alert" id="img-alert" role="alert"></div>
        </fieldset>
        ${ta('ef-cap', 'Legenda', 'data-f="cap"', o.cap, 3)}`;
      if (o.type === 'text') body = `${ta('ef-body', 'Texto, um parágrafo por linha', 'data-lines="body"', o.body.join('\n'), 5)}${ta('ef-list', 'Boas práticas em lista, uma por linha (opcional)', 'data-lines="list"', (o.list || []).join('\n'), 4)}`;
      return formWrap(`${TYPE_NAME[o.type]} · ${esc(hit.m.t)}`, top + body, `<button type="button" class="btn-quiet danger" data-del="${o.id}">Excluir passo</button>`);
    }
    if (hit.kind === 'q') {
      const i = d.quiz.indexOf(o), hasMod = d.course.some((m) => m.id === o.mod);
      return formWrap(`Pergunta ${i + 1}`, `${ta('ef-q', 'Enunciado', 'data-f="q"', o.q, 3)}
        <div class="field"><label for="ef-qmod">Tema (módulo)</label><select class="input" id="ef-qmod" data-f="mod">${hasMod ? '' : '<option value="" selected>Escolha um módulo</option>'}${modOptions({ course: d.course.filter((m) => !m.sector) }, o.mod)}</select><span class="hint">Quem errar esta pergunta recebe reforço neste tema.</span></div>
        <fieldset class="ed-fs"><legend>Alternativas: marque a correta</legend>
          ${o.opts.map((x, k) => `<div class="opt-row"><input type="radio" name="ef-ok" value="${k}" ${o.ok === k ? 'checked' : ''} aria-label="A alternativa ${k + 1} é a correta"><input class="input" data-opt="${k}" value="${esc(x)}" aria-label="Alternativa ${k + 1}" autocomplete="off"><button type="button" class="icon-btn" data-delopt="${k}" aria-label="Remover a alternativa ${k + 1}" ${o.opts.length <= 2 ? 'disabled' : ''}>×</button></div>`).join('')}
          ${o.opts.length < 5 ? '<button type="button" class="btn-quiet" id="add-opt" style="justify-self:start">Adicionar alternativa</button>' : ''}
        </fieldset>`, `<button type="button" class="btn-quiet danger" data-del="${o.id}">Excluir pergunta</button>`);
    }
    const i = d.phish.indexOf(o), lk = 'link' in o ? 'link' : 'cta' in o ? 'cta' : 'none';
    return formWrap(`E-mail ${i + 1}`, `
      <fieldset class="ed-fs ed-kind"><legend>Este e-mail é</legend><label class="check"><input type="radio" name="ef-kind" value="1" ${o.phish ? 'checked' : ''}> Golpe (phishing)</label><label class="check"><input type="radio" name="ef-kind" value="0" ${o.phish ? '' : 'checked'}> Legítimo</label></fieldset>
      <p class="alert warn">Use só marcas e domínios fictícios. Nomes de bancos, lojas, órgãos públicos ou serviços reais bloqueiam a publicação.</p>
      <div class="ed-row2">${tf('ef-from', 'Nome do remetente', 'from', o.from)}${tf('ef-addr', 'Endereço do remetente', 'addr', o.addr, 'spellcheck="false" inputmode="email"')}</div>
      ${tf('ef-subj', 'Assunto', 'subj', o.subj)}
      ${ta('ef-body', 'Texto do e-mail, um parágrafo por linha', 'data-lines="body"', o.body.join('\n'), 4)}
      <div class="ed-row2"><div class="field"><label for="ef-lk">Elemento clicável</label><select class="input" id="ef-lk" data-lk><option value="cta" ${lk === 'cta' ? 'selected' : ''}>Botão</option><option value="link" ${lk === 'link' ? 'selected' : ''}>Link em texto</option><option value="none" ${lk === 'none' ? 'selected' : ''}>Nenhum</option></select></div>
      <div class="field"><label for="ef-lt">${lk === 'link' ? 'Texto do link' : 'Texto do botão'}</label><input class="input" id="ef-lt" data-lt value="${esc(o.cta || o.link || '')}" autocomplete="off" ${lk === 'none' ? 'disabled' : ''}></div></div>
      ${o.phish ? ta('ef-signs', 'Sinais de golpe, um por linha', 'data-lines="signs"', (o.signs || []).join('\n'), 4, 'Aparecem na tela "Você caiu num teste de phishing" e na revisão.') : ''}`,
      `<button type="button" class="btn-quiet danger" data-del="${o.id}">Excluir e-mail</button>`);
  }

  function edPreview(at, d = DRAFT()) {
    const hit = findIn(d, curSel(at, d)); if (!hit) return '';
    const o = hit.obj, lbl = '<span class="mono ed-pv-label">PRÉ-VISUALIZAÇÃO · COMO O COLABORADOR VÊ</span>';
    if (hit.kind === 'mod') return `<div class="ed-preview">${lbl}<section class="panel module"><div class="module-head"><span class="mn">${pad2(d.course.indexOf(o) + 1)}</span><div><h3>${untitled(o.t, 'Módulo sem título')}</h3><span class="sub">0 de ${o.steps.length} passos</span></div></div><ol class="step-list">${o.steps.map((x) => `<li><span class="step-btn"><span class="st-ico">${TYPE_ICON[x.type]}</span><span>${TYPE_NAME[x.type]} · ${esc(x.t)}</span></span></li>`).join('')}</ol></section></div>`;
    if (hit.kind === 'step') { const mi = d.course.indexOf(hit.m); return `<div class="ed-preview">${lbl}<div class="stack" style="gap:6px"><span class="eyebrow">${esc(hit.m.t)} · ${TYPE_NAME[o.type]}</span><h3 class="pv-title">${untitled(o.t, 'Passo sem título')}</h3></div>${stepBody(o, mi, { preview: true })}</div>`; }
    if (hit.kind === 'q') return `<div class="ed-preview">${lbl}${qcardHTML(o, 0, Math.min(d.quizSize, Math.max(d.quiz.length, 1)), true)}<p class="hint">Na prova, a ordem das perguntas é sorteada para cada pessoa.</p></div>`;

  }

  function viewEditor(at) {
    if (at === 'publicar') return viewPublish();

    const settings = at === 'perguntas' ? `<div class="panel pad ed-settings"><div class="field"><label for="ef-qsize">Perguntas sorteadas por prova</label><input class="input" type="number" inputmode="numeric" id="ef-qsize" data-qsize min="5" max="30" value="${d.quizSize}"></div><p class="sub">O banco tem <strong>${d.quiz.length}</strong> perguntas. Cada pessoa recebe ${d.quizSize} sorteadas, e a nota vai de 0 a 10. Um banco com pelo menos uma vez e meia o tamanho da prova evita provas repetidas.</p></div>` : '';
    const intro = at === 'phishing' ? '<p class="sub ed-intro">A ordem da lista é a ordem da caixa de entrada na prova prática. Nenhum e-mail real é enviado.</p>' : at === 'aulas' ? '<p class="sub ed-intro">Os passos seguem esta ordem na trilha. Use as setas para reordenar e escolha o tipo ao adicionar.</p>' : '';
    return `${settings}${intro}<div class="ed-grid"><nav class="panel ed-list" id="ed-list" aria-label="Itens para editar">${edList(at, d)}</nav><div class="ed-main"><div id="ed-form-wrap">${edForm(at, d)}</div><div id="ed-preview">${edPreview(at, d)}</div></div></div>`;
  }

  function viewPublish() {
    const C = state.content, dirty = isDirty(), d = DRAFT();
    const issues = dirty ? validateContent(d) : [], crit = issues.filter((x) => x.lvl === 'crit'), warn = issues.filter((x) => x.lvl === 'warn');
    const diff = dirty ? diffContent(C.pub.data, C.draft) : null;
    const act = state.users.filter((x) => x.role === 'colab' && x.status === 'ativo'), finished = act.filter((x) => doneN(x) >= STEP_COUNT());
    const issueLi = (x) => `<li class="${x.lvl}"><span>${esc(x.msg)}</span>${x.go ? `<button type="button" class="btn-quiet" data-goto="${x.go}">Corrigir</button>` : ''}</li>`;
    return `<div class="pub-grid">
      <section class="panel pad stack" aria-labelledby="pub-title" style="gap:18px">
        <h2 class="h-panel" id="pub-title">${dirty ? `Publicar a versão ${C.pub.v + 1}` : 'Nenhuma alteração para publicar'}</h2>
        ${dirty ? `
        <div class="stack" style="gap:8px"><h3>O que muda</h3><ul class="p-list">${diff.parts.map((x) => `<li>${esc(x)}</li>`).join('') || '<li>Mudança na ordem dos itens.</li>'}</ul></div>
        <div class="stack" style="gap:8px"><h3>Conferência</h3>${issues.length ? `<ul class="val-list">${crit.map(issueLi).join('')}${warn.map(issueLi).join('')}</ul>` : '<p class="state ok">Tudo certo para publicar.</p>'}</div>
        <div class="stack" style="gap:8px"><h3>Para quem já está no curso</h3><ul class="p-list">
          <li>Certificados já emitidos continuam válidos, com o mesmo código.</li>
          <li>Notas de provas já feitas não mudam. O banco novo vale a partir da próxima tentativa.</li>
          ${diff.addSteps ? `<li>${finished.length} pessoa${finished.length === 1 ? '' : 's'} que já tinha${finished.length === 1 ? '' : 'm'} terminado as aulas ${finished.length === 1 ? 'vai' : 'vão'} ver ${diff.addSteps} passo${diff.addSteps === 1 ? ' novo' : 's novos'}, com a marca "novo" na trilha, e o percentual do curso dela${finished.length === 1 ? '' : 's'} diminui até concluir.</li>` : ''}
          ${diff.delSteps ? '<li>Passos removidos deixam de contar no progresso de todos.</li>' : ''}

  function onImage(inp) {
    const f = inp.files && inp.files[0]; if (!f) return;

      const img = new Image();

      img.onload = () => {

        cv.width = Math.max(1, Math.round(img.width * sc)); cv.height = Math.max(1, Math.round(img.height * sc));
        const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(img, 0, 0, cv.width, cv.height);
        let url = cv.toDataURL('image/jpeg', 0.82); if (url.length > 900e3) url = cv.toDataURL('image/jpeg', 0.6);

          ${sectors.map((x) => { const b = riskBand(x.total); return `<tr><td>${esc(x.sec)}<div class="sub">${x.n} pessoa${x.n > 1 ? 's' : ''}</div></td><td><div class="rcell">${riskMeter(x.total)}<strong style="color:var(--${b.cls})">${x.total}</strong></div><span class="sub">${b.k}</span></td><td><span class="parts mono">${x.parts.rc} · ${x.parts.rp} · ${x.parts.rf}</span><div class="sub">pesa mais: ${x.driver}</div></td></tr>`; }).join('')}
        </tbody></table></div>
      </section>
    </div>

    <section class="panel" aria-labelledby="att-title" style="margin-top:24px">
      <div class="pad row between" style="padding-bottom:12px;align-items:baseline"><h2 id="att-title" class="h-panel">Quem precisa de atenção</h2><span class="sub">${att.length} pessoa${att.length === 1 ? '' : 's'} · do maior para o menor risco</span></div>
      <div class="table-wrap"><table class="data att-table"><thead><tr><th scope="col">Colaborador</th><th scope="col">Motivo</th><th scope="col">Risco</th><th scope="col"><span class="visually-hidden">Ação</span></th></tr></thead><tbody>
        ${att.map(({ x, r, risk }) => { const b = riskBand(risk), st = statusOf(x).key; return `<tr><td>${esc(x.name)}<div class="sub">${esc(x.sector)}</div></td><td><ul class="reasons">${r.map((t) => `<li>${t}</li>`).join('')}</ul>${x.lastReminder ? `<span class="sub">Último lembrete: ${dateBR(x.lastReminder)}</span>` : ''}</td><td><strong style="color:var(--${b.cls})">${risk}</strong> <span class="sub">${b.k}</span></td><td style="text-align:right;white-space:nowrap">${readOnly ? '' : (st === 'expirado' || st === 'bloqueado') ? `<button type="button" class="btn-quiet" data-regen="${x.id}">Reenviar convite</button>` : `<button type="button" class="btn-quiet" data-remind="${x.id}">Enviar lembrete</button>`}</td></tr>`; }).join('') || '<tr><td colspan="4" class="sub">Ninguém precisa de atenção agora.</td></tr>'}
      </tbody></table></div>
    </section>

    <div class="rem-grid">
      <section class="panel pad" aria-labelledby="rem-title">
        <form class="form" id="rem-form">
          <div class="row between" style="align-items:baseline"><h2 id="rem-title" class="h-panel">Lembretes automáticos</h2><label class="switch"><input type="checkbox" id="rem-on" ${R.on ? 'checked' : ''} ${dis}><span>${R.on ? 'Ligados' : 'Desligados'}</span></label></div>

          <div class="rem-fields">
            <div class="field"><label for="rem-deadline">Prazo para concluir</label><input class="input" type="date" id="rem-deadline" value="${new Date(R.deadline - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10)}" ${dis}><span class="hint">${dl > 0 ? `Faltam ${dl} dias` : dl === 0 ? 'Vence hoje' : `Venceu há ${-dl} dias`}</span></div>
            <div class="field"><label for="rem-freq">Frequência</label><select class="input" id="rem-freq" ${dis}>${[[2, 'A cada 2 dias'], [3, 'A cada 3 dias'], [7, 'Uma vez por semana']].map(([v, t]) => `<option value="${v}" ${R.freq === v ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
          </div>
          <fieldset class="rem-rules"><legend>Quem recebe</legend>
            <label class="check"><input type="checkbox" id="rem-acesso" ${R.rules.acesso ? 'checked' : ''} ${dis}><span>Quem ainda não fez o primeiro acesso</span></label>
            <label class="check"><input type="checkbox" id="rem-curso" ${R.rules.curso ? 'checked' : ''} ${dis}><span>Quem não concluiu o curso e as duas provas</span></label>
            <label class="check"><input type="checkbox" id="rem-reforco" ${R.rules.reforco ? 'checked' : ''} ${dis}><span>Quem ficou abaixo da nota mínima</span></label>
          </fieldset>
          <div class="rem-status">
            <div><span class="mono muted">PRÓXIMO ENVIO</span><strong>${R.on ? dateBR(next) : 'Desligado'}</strong></div>
            <div><span class="mono muted">VÃO RECEBER</span><strong>${targets.length} pessoa${targets.length === 1 ? '' : 's'}</strong></div>
          </div>
          ${readOnly ? '' : `<button type="button" class="btn btn-secondary btn-block" id="rem-now" ${targets.length ? '' : 'disabled'}>Enviar lembretes agora</button>`}
          <p class="hint">No protótipo o envio é simulado: nenhum e-mail sai daqui.</p>

        <h3 style="margin-top:22px">Histórico de envios</h3>
        <ol class="rem-log">${(R.log || []).slice().reverse().map((l) => `<li><span class="mono">${fmt(l.at)}</span><span>${l.n} lembrete${l.n === 1 ? '' : 's'}${l.who ? ` · ${esc(l.who)}` : ''}</span><span class="sub">${l.auto ? 'automático' : 'manual'}</span></li>`).join('') || '<li class="sub">Nenhum envio ainda.</li>'}</ol>
      </section>
      <section class="panel pad" aria-labelledby="rem-prev-title">
        <h2 id="rem-prev-title" class="h-panel">Prévia do lembrete</h2>

          <div class="meta"><span><b>De:</b> BentexSEC &lt;nao-responda@bentexsec.exemplo&gt;</span><span><b>Para:</b> ${ex ? esc(ex.email) : 'colaborador@empresa'}</span><span><b>Assunto:</b> ${dl > 0 ? `Faltam ${dl} dias para concluir o curso de segurança` : 'O prazo do curso de segurança terminou'}</span></div>
          <p>Olá, ${ex ? esc(first(ex.name)) : 'colaborador'}.</p>
          <p>${ex && ex.status === 'ativo' ? `Você já fez <b>${exPct}%</b> das aulas da ${CERT_COURSE}.` : `Seu acesso à ${CERT_COURSE} ainda não foi ativado. Use a senha provisória do convite ou peça um novo ao TI.`}</p>
          <p>O prazo definido pela ${esc(c.name)} é <b>${dateBR(R.deadline)}</b>. O curso todo leva cerca de 40 minutos.</p>
          <span class="rem-btn">Continuar o curso</span>
          <p class="small" style="color:#55607A">Você recebe este lembrete porque ainda não concluiu o curso. Ele para assim que você concluir. Este e-mail nunca pede a sua senha.</p>
        </div>
      </section>
    </div>`;
  }

  /* Gestão: relatório de evidências para auditoria */
  function reportData(c, list) {
    const act = list.filter((x) => x.status === 'ativo'), done = list.filter((x) => doneN(x) >= STEP_COUNT() && x.quiz);
    const certs = list.filter((x) => x.cert), sc = list.filter((x) => x.quiz), ph = list.filter((x) => x.phish);
    const p = (a, b) => (b ? Math.round((a / b) * 100) : 0);
    return { n: list.length, act: act.length, actP: p(act.length, list.length), done: done.length, doneP: p(done.length, list.length), certs: certs.length, avg: sc.length ? sc.reduce((a, x) => a + x.quiz.score, 0) / sc.length : null, phN: ph.length, clickP: p(ph.filter((x) => x.phish.clicks).length, ph.length), below: sc.filter((x) => x.quiz.score < c.minScore).length, pend: list.filter((x) => x.status !== 'ativo').length, risk: groupRisk(list).total };
  }
  function viewReport(u, c, list) {
    const d = reportData(c, list), rb = riskBand(d.risk), g = state.users.find((x) => x.role === 'gestor' && x.companyId === c.id && x.status === 'ativo');
    const start = Math.min(...list.map((x) => x.tempIssued || Date.now())), code = 'REL-' + new Date().getFullYear() + '-' + c.id.toUpperCase() + '-' + String(new Date().getMonth() + 1).padStart(2, '0');
    const sectors = [...new Set(list.map((x) => x.sector))].map((sec) => { const l = list.filter((x) => x.sector === sec), r = reportData(c, l); return { sec, ...r }; }).sort((a, b) => a.sec.localeCompare(b.sec));
    const cov = d.doneP, st = (ok, mid) => (ok ? '<span class="state ok">Atendido</span>' : mid ? '<span class="state warn">Em andamento</span>' : '<span class="state crit">Pendente</span>');
    const req = [
      ['ISO/IEC 27001:2022 · Anexo A 6.3', 'Programa de conscientização, educação e treinamento em segurança para todo o pessoal, atualizado regularmente.', `Trilha de 5 módulos aplicada a ${d.n} pessoas; registro individual de aulas, prova e prova prática de phishing; lembretes e reforço.`, st(cov >= 90, cov > 0)],
      ['ISO/IEC 27001:2022 · Cláusula 7.2 (Competência)', 'Evidência documentada de que as pessoas têm a competência necessária.', `${d.certs} certificado${d.certs === 1 ? '' : 's'} com código verificável; nota individual da prova (mínimo ${nota(c.minScore)}).`, st(d.certs >= d.n * 0.9, d.certs > 0)],
      ['ISO/IEC 27001:2022 · Cláusula 7.3 (Conscientização)', 'Pessoas cientes da política de segurança, do seu papel e das consequências de não cumprir.', `Conteúdo dos módulos e resultado da caça ao phishing (${d.phN} pessoa${d.phN === 1 ? '' : 's'}, ${d.clickP}% clicaram).`, st(cov >= 90 && d.clickP <= 10, d.phN > 0)],
      ['LGPD · Art. 46', 'Medidas de segurança técnicas e administrativas para proteger dados pessoais.', 'Treinamento como medida administrativa, com módulo específico de LGPD e registro de conclusão.', st(cov >= 90, cov > 0)],
      ['LGPD · Art. 50', 'Boas práticas e governança, incluindo ações educativas.', `Programa contínuo com prazo, lembretes automáticos (${(c.rem?.log || []).length} envios) e treinamento de reforço.`, st(cov >= 90 && c.rem?.on, true)],
    ];
    const actions = [];
    if (d.pend) actions.push(`Reenviar convite ou cobrar o primeiro acesso de ${d.pend} pessoa${d.pend === 1 ? '' : 's'}.`);
    if (d.n - d.done - d.pend > 0) actions.push(`Acompanhar ${d.n - d.done - d.pend} pessoa${d.n - d.done - d.pend === 1 ? '' : 's'} com o curso em andamento até ${dateBR(c.rem.deadline)}.`);
    if (d.below) actions.push(`Encaminhar ${d.below} pessoa${d.below === 1 ? '' : 's'} abaixo da nota mínima para o reforço.`);
    sectors.filter((x) => riskBand(x.risk).k === 'Alto').forEach((x) => actions.push(`Ação direcionada no setor ${x.sec} (risco ${x.risk}).`));
    return `
    <div class="report-actions row between">
      <p class="hint" style="max-width:62ch">Documento interno: contém dados pessoais dos colaboradores. Compartilhe só com o auditor ou com o responsável pela conformidade. No produto real, ele sai em PDF e a tabela em CSV.</p>
      <div class="row"><button type="button" class="btn btn-secondary btn-sm" id="copy-summary">Copiar resumo</button><button type="button" class="btn btn-secondary btn-sm" id="copy-csv">Copiar tabela (CSV)</button></div>
    </div>
    <span class="hint" id="report-hint" aria-live="polite"></span>
    <article class="paper" aria-label="Relatório de evidências">
      <header class="paper-head">
        <div class="row" style="gap:14px"><img src="logo.webp" alt="" width="48" height="48"><div><span class="p-eyebrow">BentexSEC · Relatório de evidências</span><h2 class="p-title">Programa de conscientização em segurança da informação</h2></div></div>
        <dl class="p-meta"><div><dt>Empresa</dt><dd>${esc(c.name)}</dd></div><div><dt>Período</dt><dd>${dateBR(start)} a ${dateBR(Date.now())}</dd></div><div><dt>Gerado em</dt><dd>${fmt(Date.now())}</dd></div><div><dt>Responsável</dt><dd>${g ? `${esc(g.name)}, ${esc(g.title)}` : '—'}</dd></div><div><dt>Código</dt><dd>${code}</dd></div></dl>
      </header>

      <section><h3 class="p-h">1. Resumo</h3>
        <div class="p-kpis">
          <div><span>Pessoas no programa</span><strong>${d.n}</strong></div>
          <div><span>Acesso ativado</span><strong>${d.actP}%</strong></div>
          <div><span>Concluíram aulas e prova</span><strong>${d.doneP}%</strong></div>
          <div><span>Certificados emitidos</span><strong>${d.certs}</strong></div>
          <div><span>Média da prova</span><strong>${d.avg == null ? '—' : nota(d.avg)}</strong></div>
          <div><span>Clicaram em phishing</span><strong>${d.phN ? d.clickP + '%' : '—'}</strong></div>
          <div><span>Índice de risco</span><strong>${d.risk} · ${rb.k}</strong></div>
        </div>
      </section>

      <section><h3 class="p-h">2. Requisitos e evidências</h3>
        <div class="p-table"><table><thead><tr><th>Requisito</th><th>O que pede</th><th>Evidência no BentexSEC</th><th>Situação</th></tr></thead><tbody>
          ${req.map((r) => `<tr><td><strong>${r[0]}</strong></td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}
        </tbody></table></div>
        <p class="p-note">"Atendido" quando ao menos 90% das pessoas concluíram. Este relatório reúne evidências; quem avalia a conformidade é o auditor. Não substitui parecer jurídico.</p>
      </section>

      <section><h3 class="p-h">3. Resultados por setor</h3>
        <div class="p-table"><table><thead><tr><th>Setor</th><th>Pessoas</th><th>Ativos</th><th>Concluíram</th><th>Média</th><th>Cliques</th><th>Risco</th></tr></thead><tbody>
          ${sectors.map((x) => `<tr><td>${esc(x.sec)}</td><td>${x.n}</td><td>${x.act}</td><td>${x.doneP}%</td><td>${x.avg == null ? '—' : nota(x.avg)}</td><td>${x.phN ? x.clickP + '%' : '—'}</td><td>${x.risk} · ${riskBand(x.risk).k}</td></tr>`).join('')}
        </tbody></table></div>
      </section>

      <section><h3 class="p-h">4. Registro individual</h3>
        <div class="p-table"><table><thead><tr><th>Colaborador</th><th>Setor</th><th>Acesso</th><th>Curso</th><th>Nota</th><th>Phishing</th><th>Certificado</th></tr></thead><tbody>
          ${list.slice().sort((a, b) => a.name.localeCompare(b.name)).map((x) => `<tr><td>${esc(x.name)}</td><td>${esc(x.sector)}</td><td>${statusOf(x).label}</td><td>${x.status === 'ativo' ? pct(x) + '%' : '—'}</td><td>${x.quiz ? nota(x.quiz.score) : '—'}</td><td>${x.phish ? (x.phish.clicks ? x.phish.clicks + ' clique' + (x.phish.clicks > 1 ? 's' : '') : 'sem cliques') : '—'}</td><td>${x.cert ? `${x.cert}<br><span class="p-small">${dateBR(x.certAt || x.quiz.at)}</span>` : '—'}</td></tr>`).join('')}
        </tbody></table></div>
      </section>

      <section><h3 class="p-h">5. Plano de ação</h3>
        <ol class="p-list">${actions.map((a) => `<li>${a}</li>`).join('') || '<li>Nenhuma pendência. Manter o programa e repetir o ciclo anualmente.</li>'}</ol>
      </section>

      <section><h3 class="p-h">6. Metodologia</h3>
        <ul class="p-list">
          <li>Conteúdo padrão BentexSEC, versão ${state.content.pub.v} (publicada em ${dateBR(state.content.pub.at)}): ${COURSE.map((m) => esc(m.t)).join(', ')}; prova com ${Math.min(QUIZ_SIZE, QUIZ.length)} perguntas sorteadas de um banco de ${QUIZ.length}; prova prática com ${PHISH.length} e-mails de marcas fictícias.</li>
          <li>Conclusão: todas as aulas lidas (vídeos assistidos até o fim) e prova final feita. Nota mínima da empresa: ${nota(c.minScore)}.</li>
          <li>Índice de risco (0 a 100): 35% curso não concluído, 35% distância da nota 10 e 30% phishing; quem não ativou ou não fez uma etapa conta como risco máximo nela.</li>
          <li>Certificados verificáveis publicamente pelo código, sem exibir a nota.</li>
        </ul>
      </section>
      <footer class="paper-foot"><span>${code}</span><span>Documento interno · contém dados pessoais (LGPD)</span></footer>
    </article>`;
  }
  function reportText(c, list) {
    const d = reportData(c, list);
    return [`Relatório de evidências · Programa de conscientização em segurança da informação`, `Empresa: ${c.name} · Gerado em ${fmt(Date.now())}`, '', `Pessoas no programa: ${d.n}`, `Acesso ativado: ${d.actP}%`, `Concluíram aulas e prova: ${d.doneP}%`, `Certificados emitidos: ${d.certs}`, `Média da prova: ${d.avg == null ? '—' : nota(d.avg)}`, `Clicaram em phishing: ${d.phN ? d.clickP + '%' : '—'}`, `Índice de risco: ${d.risk} (${riskBand(d.risk).k})`, '', 'Evidências para ISO/IEC 27001:2022 (Anexo A 6.3, cláusulas 7.2 e 7.3) e LGPD (Arts. 46 e 50).'].join('\n');
  }
  function reportCSV(c, list) {
    const q = (v) => `"${String(v).replace(/"/g, '""')}"`;
    return [['Colaborador', 'E-mail', 'Setor', 'Acesso', 'Curso (%)', 'Nota', 'Cliques em phishing', 'Certificado', 'Data do certificado'].map(q).join(';'), ...list.map((x) => [x.name, x.email, x.sector, statusOf(x).label, x.status === 'ativo' ? pct(x) : '', x.quiz ? nota(x.quiz.score) : '', x.phish ? x.phish.clicks : '', x.cert || '', x.cert ? dateBR(x.certAt || x.quiz.at) : ''].map(q).join(';'))].join('\n');
  }

  /* Colaborador: trilha, aulas, prova e resultado */
  function viewColab(u, head, notice) {
    const ui = state.ui;
    if (ui.screen === 'step') return viewStep(u, ui.step);
    if (ui.screen === 'quiz') return viewQuiz(u);
    if (ui.screen === 'result') return viewResult(u);
    if (ui.screen === 'phish') return viewPhish(u);
    if (ui.screen === 'phishresult') return viewPhishResult(u);
    if (ui.screen === 'refrev') return viewRefRev(u, ui.mod);
    if (ui.screen === 'refchk') return viewRefChk(u, ui.mod);
    const c = company(u.companyId), p = pct(u), allDone = COURSE.every((m) => m.steps.every((s) => u.done.includes(s.id)));
    const next = COURSE.flatMap((m) => m.steps).find((s) => !u.done.includes(s.id));
    const cs = courseState(u), lv = levelOf(u), ach = newAchievements(u), tr = trackOf(u);
    const achHTML = ach ? `<div class="ach-toast" role="status">${ach.level ? `<span class="ach-lvl">${levelBadge(ach.level.n, 40)}</span>` : `<span class="ach-ico">${medalSvg(ach.medals[0].id, 26)}</span>`}<div><strong>${ach.level ? `Você subiu para o nível ${ach.level.n}: ${ach.level.name}` : ach.medals.length > 1 ? `${ach.medals.length} medalhas novas` : `Medalha nova: ${ach.medals[0].t}`}</strong><span class="sub">${ach.level && ach.medals.length ? `Medalha${ach.medals.length > 1 ? 's' : ''} nova${ach.medals.length > 1 ? 's' : ''}: ${ach.medals.map((m) => m.t).join(', ')}. ` : !ach.level && ach.medals.length > 1 ? ach.medals.map((m) => m.t).join(', ') + '. ' : !ach.level ? ach.medals[0].d.replace(/\.$/, '') + ': feito. ' : ''}<a href="#conquistas">Ver conquistas</a></span></div></div>` : '';
    return `${head(`${esc(c.name)} · ${esc(u.sector)}`, `Olá, ${esc(first(u.name))}`, 'Faça as aulas em ordem. Cada passo precisa ser marcado como lido para liberar o próximo.')}
    ${notice}${achHTML}
    <section class="panel pad course-top">
      <div class="ring" style="--v:${p}"><span>${p}%</span></div>
      <div class="stack" style="gap:6px"><span class="mono muted">SEU PROGRESSO</span><h2 class="h-panel">${next ? 'Continue de onde parou' : inRef(u) ? 'Treinamento de reforço' : p === 100 ? 'Curso concluído' : !u.quiz ? 'Aulas concluídas: falta a prova' : 'Falta a caça ao phishing'}</h2><p class="sub"><a class="lvl-inline" href="#conquistas">${levelBadge(lv.n, 22)} Nível ${lv.n} · ${lv.name} · ${lv.pts} pontos</a> · ${doneN(u)} de ${STEP_COUNT()} passos lidos${u.quiz ? ` · nota ${nota(u.quiz.score)}` : ''}</p></div>
      <div class="row" style="margin-left:auto">${next ? `<button type="button" class="btn btn-primary pulse" data-step="${next.id}">Continuar ${icon('arrow')}</button>` : inRef(u) ? (() => { const a = nextRefAction(u); return `<button type="button" class="btn btn-primary pulse" ${a.attr}>${a.label} ${icon('arrow')}</button>`; })() : !u.quiz ? `<button type="button" class="btn btn-primary pulse" data-ui="quiz">Fazer a prova ${icon('arrow')}</button>` : `<button type="button" class="btn btn-primary" data-ui="result">Ver resultado ${icon('arrow')}</button>`}</div>
    </section>
    ${inRef(u) ? refPanel(u, c) : ''}
    <div class="module-list">
      ${COURSE.map((m, mi) => { const d = m.steps.filter((s) => u.done.includes(s.id)).length; return `
      <section class="panel module" aria-labelledby="mod-${m.id}">
        <div class="module-head"><span class="mn">${String(mi + 1).padStart(2, '0')}</span><div><h3 id="mod-${m.id}">${esc(m.t)}</h3><span class="sub">${d} de ${m.steps.length} passos</span></div><span class="state ${d === m.steps.length ? 'ok' : d ? 'info' : 'warn'}" style="margin-left:auto">${d === m.steps.length ? 'Concluído' : d ? 'Em andamento' : 'Não iniciado'}</span></div>
        <ol class="step-list">${m.steps.map((s) => { const done = u.done.includes(s.id), open = isOpen(u, s.id); return `<li><button type="button" class="step-btn ${done ? 'done' : ''}" data-step="${s.id}" ${open ? '' : 'disabled aria-disabled="true"'}><span class="st-ico">${done ? '✓' : open ? TYPE_ICON[s.type] : LOCK_SVG}</span><span>${TYPE_NAME[s.type]} · ${esc(s.t)}${!done && s.addedAt && u.activatedAt && s.addedAt > u.activatedAt ? ' <span class="new-tag">novo</span>' : ''}</span></button></li>`; }).join('')}</ol>

          </div></li>`; }).join('')}
      </ol>

    </section>`;
  }

  function viewRefRev(u, mid) {
    const m = COURSE.find((x) => x.id === mid); if (!m || !inRef(u)) { state.ui = { screen: 'home' }; return viewColab(u, () => '', ''); }

    <div class="step-top"><button type="button" class="btn-quiet" data-ui="home">← Minha trilha</button><span class="step-meta"><button type="button" class="btn-quiet" id="logout">Sair</button></span><span class="mono muted">REFORÇO · TEMA ${ms.indexOf(mid) + 1} DE ${ms.length}</span></div>

    ${w.length ? `<section class="panel pad ref-wrong" aria-labelledby="w-title"><h2 class="h-panel" id="w-title">Onde você errou</h2><ol class="ans-list">${w.map(({ q, a }) => `<li class="crit"><strong>${esc(q.q)}</strong><span>Sua resposta: ${a >= 0 ? esc(q.opts[a]) : 'em branco'}</span><span class="right">Resposta certa: ${esc(q.opts[q.ok])}</span></li>`).join('')}</ol></section>` : ''}
    ${m.steps.map((x) => `<section class="panel pad ref-step" aria-label="${esc(x.t)}"><span class="mono muted">${TYPE_NAME[x.type].toUpperCase()}</span><h2 class="h-panel">${esc(x.t)}</h2>${x.type === 'video' ? `<div class="stack" style="gap:6px"><span class="sub">Resumo do vídeo</span><ul class="lesson-text plain">${x.caps.map((cp) => `<li>${esc(cp)}</li>`).join('')}</ul></div>` : stepBody(x, mi, {})}</section>`).join('')}
    <div class="step-actions"><button type="button" class="btn btn-primary" data-refrevdone="${mid}">Concluí a revisão ${icon('arrow')}</button><span class="hint">Em seguida vem a verificação rápida deste tema.</span></div>`;
  }

  function viewRefChk(u, mid) {
    const m = COURSE.find((x) => x.id === mid); if (!m || !inRef(u) || !u.ref.rev.includes(mid)) { state.ui = { screen: 'home' }; return viewColab(u, () => '', ''); }
    const ui = state.ui; if (!ui.chkIds || !ui.chkIds.length) ui.chkIds = pickCheck(u, mid);
    const qs = ui.chkIds.map((id) => QUIZ.find((q) => q.id === id)).filter(Boolean), res = ui.chkRes;
    const top = `<div class="step-top"><button type="button" class="btn-quiet" data-ui="home">← Minha trilha</button><span class="step-meta"><button type="button" class="btn-quiet" id="logout">Sair</button></span><span class="mono muted">REFORÇO · VERIFICAÇÃO RÁPIDA</span></div>
    <div class="stack" style="gap:8px"><span class="eyebrow">${esc(m.t)}</span><h1 class="page-title">Verificação rápida</h1><p class="sub">Acerte ${qs.length === 1 ? 'a pergunta' : `as ${qs.length} perguntas`} para concluir o tema. Esta verificação não muda a sua nota.</p></div>`;

      <ol class="ans-list">${res.items.map((it) => `<li class="${it.ok ? 'ok' : 'crit'}"><strong>${esc(it.q.q)}</strong>${it.ok ? '<span>Certa</span>' : `<span>Sua resposta: ${it.a >= 0 ? esc(it.q.opts[it.a]) : 'em branco'}</span><span class="right">Resposta certa: ${esc(it.q.opts[it.q.ok])}</span>`}</li>`).join('')}</ol>
      <div class="row"><button type="button" class="btn btn-primary" id="refchk-retry">Tentar de novo</button><button type="button" class="btn-quiet" data-refrev="${mid}">Rever o tema</button></div>

    return `${top}
    <form class="quiz" id="refchk-form" data-mod="${mid}">
      ${qs.map((q, n) => qcardHTML(q, n, qs.length)).join('')}
      <div class="alert" id="refchk-alert" role="alert"></div>
      <button class="btn btn-primary btn-block" type="submit">Conferir</button>
    </form>`;
  }

  function onRefChk(f) {
    const u = me(), mid = f.dataset.mod, ids = state.ui.chkIds || [];
    const items = ids.map((id) => { const q = QUIZ.find((x) => x.id === id), v = f.querySelector(`input[name="${id}"]:checked`); return q && { q, a: v ? +v.value : -1 }; }).filter(Boolean);
    if (items.some((it) => it.a < 0)) return setAlert('refchk-alert', 'Responda todas as perguntas antes de conferir.');
    items.forEach((it) => { it.ok = it.a === it.q.ok; });
    u.ref.tries[mid] = (u.ref.tries[mid] || 0) + 1;
    const ok = items.filter((it) => it.ok).length;
    if (ok === items.length) {
      if (!u.ref.chk.includes(mid)) u.ref.chk.push(mid);
      const m = COURSE.find((x) => x.id === mid);
      state.notice = refReady(u) ? `Tema “${esc(m.t)}” concluído. Reforço completo: a nova tentativa da prova está liberada.` : `Tema “${esc(m.t)}” concluído.`;
      state.ui = { screen: 'home' };

  function viewRefTab(u, c, list, readOnly) {
    const act = list.filter((x) => x.status === 'ativo');
    const inR = act.filter(inRef), rec = act.filter((x) => !inRef(x) && x.quiz && failCount(x) > 0), talk = inR.filter(needsTalk);
    const avgT = rec.length ? rec.reduce((s2, x) => s2 + (x.quizHist || []).length, 0) / rec.length : 0;
    const days = (t) => Math.max(0, Math.floor((Date.now() - t) / (24 * HOUR)));
    const sit = (x) => (needsTalk(x) ? ['crit', 'Combinar conversa'] : refReady(x) ? ['ok', 'Pronto para refazer'] : x.ref.rev.length ? ['info', 'Revisando'] : ['warn', 'Não começou']);
    const counts = {}; [...inR.map((x) => refMods(x)), ...rec.map((x) => x.lastRefMods || [])].forEach((ms) => ms.forEach((id) => { counts[id] = (counts[id] || 0) + 1; }));
    const totalRef = inR.length + rec.length, topics = COURSE.map((m) => ({ m, n: counts[m.id] || 0 })).filter((t) => t.n).sort((a, b) => b.n - a.n);

      ${inR.length ? `<div class="table-wrap"><table class="data att-table"><thead><tr><th scope="col">Colaborador</th><th scope="col">Temas do reforço</th><th scope="col">Tentativas</th><th scope="col">Situação</th>${readOnly ? '' : '<th scope="col"><span class="visually-hidden">Ação</span></th>'}</tr></thead><tbody>
        ${inR.map((x) => { const [cl, lb] = sit(x), pr = refProgress(x); return `<tr><td>${esc(x.name)}<div class="sub">${esc(x.sector)} · há ${days(x.ref.since)} dia${days(x.ref.since) === 1 ? '' : 's'} no reforço</div></td>
          <td><ul class="reasons">${refMods(x).map((id) => `<li>${refDone(x, id) ? '✓ ' : ''}${esc(COURSE.find((m) => m.id === id).t)}</li>`).join('')}</ul><span class="sub">${pr.n} de ${pr.t} concluídos</span></td>
          <td class="mono">${scorePath(x)}</td><td><span class="state ${cl}">${lb}</span></td>
          ${readOnly ? '' : `<td><button type="button" class="btn-quiet" data-remind="${x.id}">Enviar lembrete</button>${x.lastReminder ? `<span class="sub" style="display:block">Último: ${dateBR(x.lastReminder)}</span>` : ''}</td>`}</tr>`; }).join('')}

      </section>
      <section class="panel pad" aria-labelledby="ref-t3"><h2 class="h-panel" id="ref-t3">Passaram depois do reforço</h2>

  const mailCard = (e, preview) => `<section class="phish-open panel" aria-label="${preview ? 'Pré-visualização do e-mail' : 'E-mail aberto'}"${preview ? ' inert' : ''}>
        <div class="pmail-head"><span class="mono muted">DE</span><div>${esc(e.from) || '<span class="sub">Remetente</span>'} <span class="sub">&lt;${esc(e.addr)}&gt;</span></div></div>
        <div class="pmail-subj">${esc(e.subj) || '<span class="sub">Assunto</span>'}</div>
        <div class="pmail-body">${e.body.map((p) => `<p>${esc(p)}</p>`).join('')}${e.cta ? `<button type="button" class="pmail-cta" data-plink="${e.id}">${esc(e.cta)}</button>` : ''}${e.link ? `<button type="button" class="pmail-link" data-plink="${e.id}">${esc(e.link)}</button>` : ''}</div>
        <div class="pmail-actions"><span class="hint">O que você faz com este e-mail?</span><div class="row"><button type="button" class="btn btn-secondary" data-pans="safe">É seguro</button><button type="button" class="btn btn-primary" data-pans="report">Reportar como golpe</button></div></div>
      </section>`;
  function viewPhish(u) {
    const ui = state.ui;
    if (!ui.pOrder) { ui.pOrder = PHISH.map((e) => e.id); ui.pAns = {}; ui.pIdx = 0; }
    ui.pOrder = ui.pOrder.filter((id) => PHISH.some((e) => e.id === id)); if (ui.pIdx >= ui.pOrder.length) ui.pIdx = 0;
    const answered = ui.pOrder.filter((id) => ui.pAns[id]).length;

    }

    <div class="stack" style="gap:8px;margin-top:4px"><span class="eyebrow">Prova prática</span><h1 class="page-title">A caixa de entrada é sua. Quais e-mails são golpe?</h1><p class="muted">Abra cada e-mail e decida. Se algum parecer golpe, reporte em vez de clicar nos links.</p></div>

      ${mailCard(e)}
    </div>`;
  }

  function viewPhishResult(u) {
    const r = u.phish; if (!r) return viewColab(u, () => '', '');
    const good = r.clicks === 0 && r.correct === r.total;
    return `<div class="step-top"><button type="button" class="btn-quiet" data-ui="home">← Minha trilha</button><span class="step-meta"><button type="button" class="btn-quiet" id="logout">Sair</button></span><span class="mono muted">RESULTADO DA CAÇA AO PHISHING</span></div>
    <div class="result ${good ? 'pass' : 'fail'}">

        <p class="sub">${good ? 'Você reconheceu todos os golpes e não clicou em nenhum link falso.' : 'Você deixou passar alguns sinais. Reveja abaixo o que marcava cada e-mail como golpe.'} A gestão vê a sua taxa de clique, sem expor isso aos colegas.</p>
        <div class="row"><button type="button" class="btn btn-primary" data-ui="home">Voltar à trilha</button><button type="button" class="btn btn-secondary" data-ui="retake-phish">Refazer</button></div>
      </div>
    </div>
    ${r.ans && Object.keys(r.ans).length ? `<details class="panel answers"><summary class="pad"><span class="h-panel" style="font-size:24px">Ver os e-mails</span><span class="sub">${r.correct} de ${r.total} certos</span></summary>
      <ol class="ans-list">${PHISH.filter((e) => e.id in r.ans).map((e) => { const a = r.ans[e.id], ok = phishMark(e, a); const act = a === 'clicked' ? 'Você clicou no link' : a === 'report' ? 'Você reportou' : a === 'safe' ? 'Você marcou como seguro' : 'Sem resposta'; return `<li class="${ok ? 'ok' : 'crit'}"><strong>${esc(e.from)} — ${esc(e.subj)}</strong><span>${act} · ${ok ? 'certo' : 'errado'}</span><span class="right">${e.phish ? 'Era golpe: o certo é reportar.' : 'Era legítimo.'}</span>${e.phish ? `<span class="sub">Sinais: ${e.signs.map(esc).join(' · ')}</span>` : ''}</li>`; }).join('')}</ol></details>` : ''}`;
  }

  const wrapApp = (html) => `<div class="app"><div class="wrap">${html}</div></div>`;
  const footer = () => `<footer class="footer"><div class="wrap"><a class="brand" href="#apresentacao"><img src="logo.webp" alt="" width="32" height="32"><span class="wordmark" style="font-size:22px">BENTEX<span>SEC</span></span></a><span class="row" style="gap:18px"><a class="btn-quiet" href="#verificar">Verificar certificado</a><span>Protótipo interno · dados fictícios · nenhum e-mail é enviado nesta demonstração.</span></span></div></footer>`;

  /* ---------- Roteamento ---------- */
  function viewVerificar() {

      <section class="panel verify-card ok" aria-live="polite">

          <div><dt>Emissor</dt><dd>BentexSEC</dd></div>

    return wrapApp(`
    <div class="verify">
      <div class="stack" style="gap:10px"><span class="eyebrow">Verificação pública</span><h1 class="page-title">Verificar certificado</h1><p class="lead">Digite o código impresso no certificado para confirmar que ele foi emitido pela BentexSEC.</p></div>

  }

  const VIEWS = { apresentacao: viewApresentacao, entrar: viewEntrar, painel: viewPainel, verificar: viewVerificar };
  const SECTIONS = ['perceber', 'como-funciona', 'objetivo', 'privacidade'];
  let current = null;
  function route(focus) {
    let h = location.hash.slice(1);
    if (h.startsWith('verificar-')) { state.verify = { code: cleanCode(h.slice(10)), checked: true }; h = 'verificar'; render('verificar', true); return; }

  }
  function go(view) { if (location.hash.slice(1) !== view) location.hash = view; else render(view, true); }

    stopGlobe();
    document.body.classList.toggle('lp-on', view === 'apresentacao');
    if (view === 'apresentacao') { setupCounters(); setupSpy(); setupHow(); setupClue(); }
    startGlobe();
    drawQR();
    if (focus) { app.focus({ preventScroll: true }); window.scrollTo({ top: 0, behavior: 'instant' }); }
    save();
  }

  function drawQR() {
    const el = document.getElementById('cert-qr'); if (!el) return;

  /* ---------- Banner: o cadeado se fecha conforme a rolagem ---------- */
  let lockRaf = 0;

    const dots = [];
    for (let lat = -78; lat <= 78; lat += 8) { const n = Math.max(6, Math.round(44 * Math.cos(lat * Math.PI / 180))); for (let k = 0; k < n; k++) dots.push([lat * Math.PI / 180, (k / n) * Math.PI * 2]); }
    const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
    const seg = (p, a, b) => clamp((p - a) / (b - a));
    const ease = (t) => 1 - Math.pow(1 - t, 3);
    function size() { const dpr = Math.min(2, devicePixelRatio || 1); S = cv.clientWidth; cv.width = S * dpr; cv.height = S * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); cx = cy = S / 2; R = S * 0.36; }

      const shackle = ease(seg(p, 0.68, 0.84));              // 0 aberto → 1 fechado

      rot += dt * 0.00012;

      ctx.strokeStyle = 'rgba(47,75,115,.7)'; ctx.lineWidth = 1;
      [1.32].forEach((k) => { ctx.setLineDash([2, 6]); ctx.beginPath(); ctx.arc(cx, cy, R * k, 0, Math.PI * 2); ctx.stroke(); }); ctx.setLineDash([]);

        const y = y0 * Math.cos(tilt) - z0 * Math.sin(tilt), z = y0 * Math.sin(tilt) + z0 * Math.cos(tilt);
        if (z > 0) { ctx.fillStyle = `rgba(${PRI},${(0.1 + z * 0.4) * (1 - logo * .3)})`; ctx.fillRect(cx + x * R - 1.2, cy - y * R - 1.2, 2.4, 2.4); }

      attacks = attacks.filter((k) => {
        k.d -= k.v * dt;

        else { q.x += q.vx * dt; q.y += q.vy * dt; ctx.fillStyle = `rgba(255,${Math.round(122 + 80 * q.life)},26,${q.life})`; ctx.fillRect(q.x - 1.5, q.y - 1.5, 3, 3); }

    const ro = new ResizeObserver(() => { if (!cv.isConnected) { ro.disconnect(); return; } size(); if (reduced.matches) frame(0); }); ro.observe(cv);

  /* ---------- Gaveta do menu ---------- */
  const drawer = $('#drawer'), openBtn = $('#drawer-open'), closeBtn = $('#drawer-close');
  const scroller = drawer.querySelector('.Drawer-scroller'), sheet = drawer.querySelector('.Drawer-sheet');
  async function openDrawer() {
    drawer.showModal();
    if (!CSS.supports('scroll-initial-target', 'nearest')) {
      scroller.scrollTo({ left: scroller.offsetWidth, behavior: 'instant' });
      await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
    }
    scroller.scrollTo({ left: 0, behavior: 'auto' });
  }
  function closeDrawer() { scroller.scrollTo({ left: scroller.offsetWidth, behavior: 'auto' }); }
  const vis = 1 / innerWidth;
  new IntersectionObserver((entries) => {
    const en = entries.at(-1);
    if (en.intersectionRatio < vis && drawer.open) { drawer.close(); openBtn.setAttribute('aria-expanded', 'false'); }

  /* ---------- Login e troca de senha ---------- */
  function setAlert(id, msg, kind = 'crit') { const el = $('#' + id); if (el) { el.className = 'alert ' + kind; el.textContent = msg; } }
  async function onLogin(f) {
    const email = f.email.value.trim().toLowerCase(), pass = f['current-password'].value, now = Date.now();
    const generic = 'E-mail ou senha incorretos. Confira os dados e tente de novo.';
    const e = state.users.find((x) => x.email === email);
    if (!e) return setAlert('login-alert', generic);
    if (e.lockedUntil > now) return setAlert('login-alert', `Acesso bloqueado após ${MAX_ATTEMPTS} tentativas erradas. Tente de novo em ${Math.ceil((e.lockedUntil - now) / 60000)} min ou peça um novo acesso.`);
    let ok, temp = false;
    if (e.status === 'ativo') ok = (await hash(pass)) === e.passHash; else { ok = pass === e.tempPass; temp = ok; }
    if (!ok) {
      e.attempts++;
      if (e.attempts >= MAX_ATTEMPTS) { e.lockedUntil = now + LOCK_MIN * 60000; e.attempts = 0; save(); return setAlert('login-alert', `Acesso bloqueado por ${LOCK_MIN} minutos após ${MAX_ATTEMPTS} tentativas erradas.`); }
      save(); const left = MAX_ATTEMPTS - e.attempts;
      return setAlert('login-alert', `${generic}${left <= 2 ? ` Restam ${left} tentativa${left > 1 ? 's' : ''} antes do bloqueio.` : ''}`);
    }
    if (temp && e.tempExpires <= now) return setAlert('login-alert', `Essa senha provisória expirou em ${fmt(e.tempExpires)}. Peça um novo acesso a quem criou o seu convite.`, 'warn');
    e.attempts = 0;
    state.session = { userId: e.id, stage: temp ? 'trocar' : 'dentro' };
    state.ui = { screen: 'home' };
    if (temp) { render('entrar', true); $('#new-password')?.focus(); } else go('painel');
  }
  async function onNewPassword(f) {
    const e = me(), v = f['new-password'].value;
    if (v.toLowerCase().includes(first(e.name).toLowerCase())) return setAlert('pw-alert', 'A senha não pode conter o seu nome. Escolha outra.');
    if (v === e.tempPass) return setAlert('pw-alert', 'A nova senha precisa ser diferente da senha provisória.');
    Object.assign(e, { passHash: await hash(v), status: 'ativo', tempPass: null, demoPass: null, activatedAt: Date.now() });
    state.session.stage = 'dentro';
    state.notice = 'Senha criada. A senha provisória foi desativada.';
    go('painel');
  }
  function updateRules(input) {
    const v = input.value, e = me();
    const nameOk = v.length > 0 && e && !v.toLowerCase().includes(first(e.name).toLowerCase());
    let met = 0;
    RULES.forEach(([k, , fn]) => { const ok = fn(v); if (ok) met++; $(`[data-rule="${k}"]`)?.classList.toggle('met', ok); });
    $('[data-rule="name"]')?.classList.toggle('met', !!nameOk); if (nameOk) met++;
    const bar = $('#strength-bar');
    if (bar) { bar.style.width = Math.min(100, (met / 6) * 100) + '%'; bar.style.background = met === 6 ? 'var(--ok)' : met >= 4 ? 'var(--warn)' : 'var(--crit)'; }
  }

  /* ---------- Criação de acessos ---------- */
  const emailOk = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
  function onNewGestor(f) {
    const name = f.name.value.trim(), email = f.email.value.trim().toLowerCase();
    if (state.users.some((u) => u.email === email)) return setAlert('gestor-alert', 'Já existe um acesso com esse e-mail.');
    let cid = f.company.value;
    if (cid === 'nova') {
      const n = f.newco.value.trim(); if (!n) return setAlert('gestor-alert', 'Digite o nome da nova empresa.');
      cid = 'c' + (state.companies.length + 1) + Math.random().toString(36).slice(2, 5);
      state.companies.push({ id: cid, name: n, minScore: 7, invited: 0 });
    }
    state.users.push(newUser({ role: 'gestor', name, email, title: f.title.value, companyId: cid, createdBy: me().id }));
    state.notice = `Acesso criado para ${esc(name)} (${esc(f.title.value)}). O convite com a senha provisória aparece na caixa de entrada simulada, na tela Entrar.`;
    render('painel', false);
  }
  function addColab(name, email, sector) {
    if (!name || !emailOk(email) || !sector) return 'dados incompletos';
    if (state.users.some((u) => u.email === email)) return 'e-mail já cadastrado';
    state.users.push(newUser({ role: 'colab', name, email, sector, companyId: me().companyId, createdBy: me().id }));
    const c = company(me().companyId); c.invited = Math.max(c.invited, colabsOf(c.id).length);
    return null;
  }
  function onNewColab(f) {
    const err = addColab(f.name.value.trim(), f.email.value.trim().toLowerCase(), f.sector.value.trim());
    if (err) return setAlert('colab-alert', err === 'e-mail já cadastrado' ? 'Já existe um acesso com esse e-mail.' : 'Preencha nome, e-mail e setor.');
    state.notice = `Acesso criado para ${esc(f.name.value.trim())}. O convite com a senha provisória aparece na caixa de entrada simulada, na tela Entrar.`;

  function onBulk(f) {

    if (!lines.length) return setAlert('bulk-alert', 'Cole pelo menos uma linha no formato nome; e-mail; setor.');
    let ok = 0; const bad = [];
    lines.forEach((l, i) => { const [n, e, s] = l.split(/[;,\t]/).map((x) => (x || '').trim()); const err = addColab(n, (e || '').toLowerCase(), s); if (err) bad.push(`linha ${i + 1} (${err})`); else ok++; });
    state.notice = `${ok} acesso${ok === 1 ? '' : 's'} criado${ok === 1 ? '' : 's'}.${bad.length ? ' Não criados: ' + bad.join(', ') + '.' : ''}`;
    render('painel', false);
  }

  /* ---------- Vídeo simulado: não deixa adiantar ---------- */
  let vTimer = 0;
  function stopVideo() { clearInterval(vTimer); vTimer = 0; }
  function playVideo() {
    const pl = $('#player'); if (!pl) return;
    const { s } = findStep(pl.dataset.step), sec = +pl.dataset.sec, btn = $('#play-btn');
    if (vTimer) { stopVideo(); btn.textContent = '▶'; btn.setAttribute('aria-label', 'Reproduzir'); return; }
    let t = +(pl.dataset.t || 0); if (t >= sec) t = 0;
    btn.textContent = '❚❚'; btn.setAttribute('aria-label', 'Pausar');
    vTimer = setInterval(() => {
      t = Math.min(sec, t + 0.1); pl.dataset.t = t;
      $('#vfill').style.width = (t / sec) * 100 + '%';
      $('#vtime').textContent = `${mmss(t)} / ${mmss(sec)}`;
      $('#caption').textContent = s.caps[Math.min(s.caps.length - 1, Math.floor((t / sec) * s.caps.length))];
      if (t >= sec) {
        stopVideo(); btn.textContent = '↻'; btn.setAttribute('aria-label', 'Assistir de novo');
        const u = me(); if (!u.watched.includes(s.id)) u.watched.push(s.id); save();
        const rb = $('#read-btn'); if (rb) { rb.disabled = false; $('#read-hint').textContent = 'Vídeo concluído. Agora você pode marcar como lido.'; }
      }
    }, 100);
  }

  /* ---------- Prova ---------- */
  function onQuiz(f) {
    const u = me(), ids = state.ui.quizIds;
    let right = 0; const wrong = new Set();
    const answers = {};
    ids.filter((id) => QUIZ.some((x) => x.id === id)).forEach((id) => { const q = QUIZ.find((x) => x.id === id), v = f.querySelector(`input[name="${id}"]:checked`); answers[id] = v ? +v.value : -1; if (v && +v.value === q.ok) right++; else wrong.add(q.mod); });
    const score = Math.round((right / Object.keys(answers).length) * 100) / 10;
    const wasRef = inRef(u), prevMods = u.ref ? refMods(u) : [];
    u.quiz = { score, at: Date.now(), wrongMods: [...wrong], answers };
    u.quizHist = [...(u.quizHist || []), { score, at: Date.now() }];
    if (score >= company(u.companyId).minScore) { if (!u.cert) { u.cert = certCode(); u.certAt = Date.now(); } if (wasRef) { u.lastRefMods = prevMods; u.ref = null; } }
    else startRef(u, [...wrong]);
    state.ui = { screen: 'result' };
    render('painel', true);
  }

  /* ---------- Prova prática de phishing ---------- */
  function phishAdvance() {
    const ui = state.ui, n = ui.pOrder.findIndex((id) => !ui.pAns[id]);
    if (n === -1) { finishPhish(me()); return; }
    ui.pIdx = n; ui.caught = null; render('painel', true);
  }
  function phishAnswer(v) { const ui = state.ui; ui.pAns[ui.pOrder[ui.pIdx]] = v; save(); phishAdvance(); }
  function phishClick(id) { const ui = state.ui, e = PHISH.find((x) => x.id === id); if (e.phish) { ui.pAns[id] = 'clicked'; ui.caught = id; save(); render('painel', true); } else { ui.pAns[id] = 'safe'; save(); phishAdvance(); } }
  function phishContinue() { state.ui.caught = null; phishAdvance(); }
  function finishPhish(u) {
    const ui = state.ui; let correct = 0, clicks = 0;
    PHISH.forEach((e) => { const a = ui.pAns[e.id]; if (a === 'clicked') clicks++; if (phishMark(e, a)) correct++; });
    u.phish = { clicks, correct, total: PHISH.length, score: Math.round((correct / PHISH.length) * 100) / 10, at: Date.now(), ans: { ...ui.pAns } };
    state.ui = { screen: 'phishresult' }; save(); render('painel', true);
  }

  /* aria-invalid acompanha :user-invalid; a mensagem de erro só é ligada ao campo quando aparece. */
  const linkError = (el, shown) => { const id = el.dataset.error; if (!id) return; const ids = (el.getAttribute('aria-describedby') || '').split(/\s+/).filter((x) => x && x !== id); if (shown) ids.push(id); if (ids.length) el.setAttribute('aria-describedby', ids.join(' ')); else el.removeAttribute('aria-describedby'); };
  const hasUI = CSS.supports('selector(:user-invalid)');
  const syncAria = (el, announce) => {
    if (!el.matches?.('input:not([type="radio"]), textarea')) return;
    const invalid = hasUI ? el.matches(':user-invalid') : !el.validity.valid;
    const was = el.getAttribute('aria-invalid') === 'true';
    el.setAttribute('aria-invalid', String(invalid)); linkError(el, invalid);
    if (invalid && !was && announce) { const err = document.getElementById(el.dataset.error); if (err) setTimeout(() => { $('#announcer').textContent = `${el.labels?.[0]?.textContent || ''}: Erro. ${err.textContent.replace('⚠', '').trim()}`; }, 500); }
  };
  document.addEventListener('blur', (ev) => syncAria(ev.target, true), true);
  document.addEventListener('input', (ev) => {
    if (ev.target.hasAttribute?.('aria-invalid')) syncAria(ev.target, false);
    if (ev.target.id === 'new-password') updateRules(ev.target);
    if (ev.target.closest?.('#ed-form') && ev.target.type !== 'file' && ev.target.dataset.moveMod == null) onEdInput(ev.target);
    if (ev.target.dataset?.qsize != null) { edit().quizSize = Math.round(+ev.target.value || 0); save(); refreshEditor(); }
    if (ev.target.id === 'f-q') { state.ui.q = ev.target.value; const pos = ev.target.selectionStart; render('painel', false); const n = $('#f-q'); n.focus(); n.setSelectionRange(pos, pos); }
  });
  document.addEventListener('change', (ev) => {
    if (ev.target.id === 'g-company') $('#new-company-field').hidden = ev.target.value !== 'nova';
    if (ev.target.dataset?.moveMod != null) { moveStepTo(ev.target.value); return; }
    if (ev.target.dataset?.qmodf != null) { state.ui.qmod = ev.target.value; state.ui.sel = null; render('painel', false); $('#qmod-f')?.focus(); return; }
    if (ev.target.id === 'ef-file') { onImage(ev.target); return; }
    if (ev.target.closest && ev.target.closest('#rem-form')) {
      const c = company(me().companyId), R = c.rem, f = ev.target.form;
      R.on = f.querySelector('#rem-on').checked; R.freq = +f.querySelector('#rem-freq').value;
      R.rules = { acesso: f.querySelector('#rem-acesso').checked, curso: f.querySelector('#rem-curso').checked, reforco: f.querySelector('#rem-reforco').checked };
      const dv = f.querySelector('#rem-deadline').value; if (dv) { const [y, m, d] = dv.split('-').map(Number); R.deadline = new Date(y, m - 1, d, 23, 59).getTime(); }
      if (R.on && !R.last) R.last = Date.now();
      render('painel', false);
    }
  });
  document.addEventListener('invalid', (ev) => { syncAria(ev.target, false); if (ev.target.type === 'radio') setAlert('quiz-alert', 'Responda todas as perguntas antes de enviar.'); }, true);
  document.addEventListener('submit', (ev) => {
    ev.preventDefault();
    const id = ev.target.id;
    if (id === 'login-form') onLogin(ev.target);
    if (id === 'pw-form') onNewPassword(ev.target);
    if (id === 'new-gestor-form') onNewGestor(ev.target);
    if (id === 'new-colab-form') onNewColab(ev.target);
    if (id === 'bulk-form') onBulk(ev.target);
    if (id === 'quiz-form') onQuiz(ev.target);
    if (id === 'refchk-form') onRefChk(ev.target);
    if (id === 'verify-form') { const c = cleanCode(ev.target.code.value); if (c) location.hash = 'verificar-' + c; }
  });
  document.addEventListener('click', (ev) => {
    const t = ev.target.closest('button'); if (!t || t.closest('.Drawer')) return;
    if (t.id === 'reset') { (async () => { stopVideo(); state = await seed(); useContent(); migrateUsers(); go('apresentacao'); })(); return; }
    if (t.dataset.reveal) { const inp = document.getElementById(t.dataset.reveal); const show = inp.type === 'password'; inp.type = show ? 'text' : 'password'; t.textContent = show ? 'Ocultar' : 'Mostrar'; t.setAttribute('aria-pressed', String(show)); return; }
    if (t.dataset.fill) { const e = byId(t.dataset.fill), f = $('#login-form'); f.email.value = e.email; f['current-password'].value = e.status === 'ativo' ? (e.demoPass || '') : e.tempPass; setAlert('login-alert', ''); $('#login-title').scrollIntoView({ behavior: reduced.matches ? 'auto' : 'smooth', block: 'center' }); f.querySelector('button[type="submit"]').focus({ preventScroll: true }); return; }
    if (t.id === 'logout' || t.id === 'cancel-pw') { state.session = null; state.ui = { screen: 'home' }; go('entrar'); return; }
    if (t.dataset.regen) {
      const e = byId(t.dataset.regen), now = Date.now();
      Object.assign(e, { tempPass: tempPassword(), tempIssued: now, tempExpires: now + TEMP_HOURS * HOUR, attempts: 0, lockedUntil: 0, status: 'pendente', passHash: null, demoPass: null });
      state.notice = `Nova senha provisória gerada para ${esc(e.name)}. O convite aparece na caixa de entrada simulada, na tela Entrar.`;
      render('painel', false); return;
    }
    if (t.dataset.company) { state.ui = { screen: 'home', companyView: t.dataset.company }; render('painel', true); return; }
    if (t.dataset.refrev) { state.ui = { screen: 'refrev', mod: t.dataset.refrev }; render('painel', true); return; }
    if (t.dataset.refchk) { state.ui = { screen: 'refchk', mod: t.dataset.refchk }; render('painel', true); return; }
    if (t.dataset.refrevdone) { const u = me(), mid = t.dataset.refrevdone; if (u.ref && !u.ref.rev.includes(mid)) u.ref.rev.push(mid);
      if (!QUIZ.some((q) => q.mod === mid)) { if (!u.ref.chk.includes(mid)) u.ref.chk.push(mid); state.ui = { screen: 'home' }; state.notice = 'Revisão concluída. Este tema não tem verificação.'; }
      else state.ui = { screen: 'refchk', mod: mid };
      render('painel', true); return; }
    if (t.id === 'refchk-retry') { state.ui = { screen: 'refchk', mod: state.ui.mod }; render('painel', true); return; }
    if (t.dataset.atab) { state.ui = { screen: 'home', atab: t.dataset.atab, qmod: state.ui.qmod }; render('painel', true); return; }
    if (t.dataset.sel) { selectItem(t.dataset.sel); document.querySelector(`[data-sel="${t.dataset.sel}"]`)?.focus(); return; }
    if (t.dataset.mv) { moveItem(t.dataset.mv); return; }
    if (t.dataset.addstep) { addItem('step', t.dataset.addstep, t.dataset.type); return; }
    if (t.id === 'add-mod') { addItem('mod'); return; }
    if (t.id === 'add-q') { addItem('q'); return; }
    if (t.id === 'add-e') { addItem('e'); return; }
    if (t.dataset.del) { delItem(t.dataset.del); return; }
    if (t.id === 'undo-del') { if (undoSnap) { state.content.draft = undoSnap; undoSnap = null; state.notice = 'Exclusão desfeita.'; render('painel', false); } return; }
    if (t.dataset.delopt) { const d = edit(), q = findIn(d, curSel('perguntas', d))?.obj, k = +t.dataset.delopt; if (q && q.opts.length > 2) { q.opts.splice(k, 1); if (q.ok === k) q.ok = 0; else if (q.ok > k) q.ok--; save(); render('painel', false); } return; }
    if (t.id === 'add-opt') { const d = edit(), q = findIn(d, curSel('perguntas', d))?.obj; if (q && q.opts.length < 5) { q.opts.push(''); save(); render('painel', false); document.querySelector(`[data-opt="${q.opts.length - 1}"]`)?.focus(); } return; }
    if (t.id === 'ef-clear-img') { const d = edit(), x = findIn(d, curSel('aulas', d))?.obj; if (x) { delete x.img; delete x.alt; if (!ART[x.art]) x.art = 'senha'; save(); render('painel', false); $('#ef-art')?.focus(); } return; }
    if (t.id === 'discard-draft') { state.content.draft = null; state.ui.sel = null; state.notice = 'Rascunho descartado. O editor voltou à versão publicada.'; render('painel', false); return; }
    if (t.id === 'restore-default') { state.content.draft = defaultData(); state.notice = 'Conteúdo de demonstração carregado no rascunho. Revise e publique quando quiser.'; render('painel', false); return; }
    if (t.id === 'publish') { publish(); return; }
    if (t.dataset.goto) { const [tab, id] = t.dataset.goto.split('|'); state.ui = { screen: 'home', atab: tab, sel: id || null }; render('painel', true); return; }
    if (t.dataset.filter) { state.ui.filter = t.dataset.filter; render('painel', false); return; }
    if (t.dataset.tab) { state.ui.tab = t.dataset.tab; render('painel', true); return; }
    if (t.dataset.remind) { const x = byId(t.dataset.remind), c = company(x.companyId); x.lastReminder = Date.now(); c.rem.log = c.rem.log || []; c.rem.log.push({ at: Date.now(), n: 1, who: x.name }); state.notice = `Lembrete enviado para ${esc(x.name)} (simulado).`; render('painel', false); return; }
    if (t.id === 'rem-now') { const c = company(me().companyId), tg = remTargets(c), now = Date.now(); tg.forEach((x) => { x.lastReminder = now; }); c.rem.last = now; c.rem.log.push({ at: now, n: tg.length }); state.notice = `${tg.length} lembrete${tg.length === 1 ? '' : 's'} enviado${tg.length === 1 ? '' : 's'} (simulado). O próximo envio automático foi reagendado.`; render('painel', false); return; }
    if (t.id === 'copy-summary' || t.id === 'copy-csv') { const c = company(state.ui.companyView || me().companyId), list = colabsOf(c.id), txt = t.id === 'copy-csv' ? reportCSV(c, list) : reportText(c, list), h = $('#report-hint'); try { navigator.clipboard.writeText(txt).then(() => { h.textContent = t.id === 'copy-csv' ? 'Tabela copiada. Cole no Excel ou no Google Planilhas.' : 'Resumo copiado.'; }, () => { h.textContent = 'O navegador bloqueou a cópia. Selecione o texto do relatório e copie.'; }); } catch { h.textContent = 'O navegador bloqueou a cópia. Selecione o texto do relatório e copie.'; } return; }
    if (t.dataset.step) { state.ui = { screen: 'step', step: t.dataset.step }; render('painel', true); return; }
    if (t.dataset.ui) {
      const k = t.dataset.ui;
      if (k === 'retake' && inRef(me()) && !refReady(me())) { state.ui = { screen: 'home' }; state.notice = 'Conclua o reforço para liberar a nova tentativa da prova.'; }
      else if (k === 'retake') state.ui = { screen: 'quiz', quizIds: pickQuiz() };
      else if (k === 'phish' || k === 'retake-phish') state.ui = { screen: 'phish', pOrder: PHISH.map((e) => e.id), pAns: {}, pIdx: 0 };
      else if (k === 'admin-home') state.ui = { screen: 'home' };
      else state.ui = { screen: k };
      render('painel', true); return;
    }
    if (t.id === 'play-btn') { playVideo(); return; }
    if (t.dataset.read) {
      const u = me(), id = t.dataset.read; if (!u.done.includes(id)) u.done.push(id);
      const o = orderFor(id), nx = o[o.indexOf(id) + 1], tr = trackOfStep(id);
      state.ui = nx ? { screen: 'step', step: nx } : { screen: 'home' };
      if (!nx && !tr) state.notice = 'Você concluiu todas as aulas. A prova final está liberada.';
      render('painel', true); return;
    }
    if (t.dataset.next) { const o = orderFor(t.dataset.next), nx = o[o.indexOf(t.dataset.next) + 1]; state.ui = nx ? { screen: 'step', step: nx } : { screen: 'home' }; render('painel', true); return; }
    if (t.dataset.pans) { phishAnswer(t.dataset.pans); return; }
    if (t.dataset.plink) { phishClick(t.dataset.plink); return; }
    if (t.dataset.pnext) { phishContinue(); return; }
    if (t.id === 'share-li') { const p = $('#li-preview'); p.hidden = !p.hidden; t.textContent = p.hidden ? 'Compartilhar no LinkedIn' : 'Ocultar prévia'; return; }
    if (t.id === 'copy-code') { const h = $('#copy-hint'), code = t.dataset.code; try { navigator.clipboard.writeText(code).then(() => { h.textContent = 'Código copiado.'; }, () => { h.textContent = `Copie manualmente: ${code}`; }); } catch { h.textContent = `Copie manualmente: ${code}`; } return; }
  });

  /* Tema: azul padrão ou escuro neon (lua). Guardado só neste navegador. */
  const themeBtn = $('#theme-btn');
  function applyTheme(t) {
    if (t === 'neon') document.documentElement.dataset.theme = 'neon'; else delete document.documentElement.dataset.theme;
    themeBtn.setAttribute('aria-pressed', String(t === 'neon'));
    themeBtn.setAttribute('aria-label', t === 'neon' ? 'Voltar ao tema azul' : 'Modo escuro neon');
    themeBtn.title = themeBtn.getAttribute('aria-label');
    syncPri();
  }
  let savedTheme = null; try { savedTheme = localStorage.getItem('bentexsec-theme'); } catch {}
  applyTheme(savedTheme);
  themeBtn.addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'neon' ? 'azul' : 'neon';
    const go = () => applyTheme(next);
    if (document.startViewTransition && !reduced.matches) document.startViewTransition(go); else go();
    try { localStorage.setItem('bentexsec-theme', next); } catch {}
  });

  window.addEventListener('hashchange', () => route(true));
  (async () => { const s = load(); state = s && s.users ? s : await seed(); useContent(); migrateUsers(); route(false); })();
})();
</script>
